name: Update forex signals

on:
  schedule:
    # ทุก 15 นาที (เวลา UTC) — GitHub อาจดีเลย์เล็กน้อยตามคิวจริง
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # ปุ่มกดรันเองได้จากแท็บ Actions

permissions:
  contents: write   # ให้ workflow commit ไฟล์ signals.json กลับเข้า repo ได้

jobs:
  update-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal engine (single pass)
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python forex_signals.py --once

      - name: Commit updated signals.json
        run: |
          git config user.name "forex-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signals.json last_signals.json
          git diff --quiet --cached || git commit -m "Update signals [skip ci]"
          git push
